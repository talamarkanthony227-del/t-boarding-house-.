
name: Boarding House CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t boarding-house .

      - name: Stop Existing Container
        run: |
          docker stop boarding-house-app 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "No running container to stop." }

      - name: Remove Existing Container
        run: |
          docker rm boarding-house-app 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "No existing container to remove." }

      - name: Deploy Container
        run: docker run -d --name boarding-house-app -p 8080:80 boarding-house

      - name: Verify Deployment
        run: docker ps
